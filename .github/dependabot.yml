# Dependabot config (SG303 baseline v1). Weekly on Sunday evening, minor and
# patch updates grouped and merged automatically by dependabot-auto-merge.yml
# once the checks pass. Majors come as separate PRs. The 7-day cooldown skips
# versions younger than a week; security updates are not delayed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x supports TypeScript <6.1.0 only; TypeScript 7
      # (native compiler) has no API it can use yet.
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # eslint-plugin-obsidianmd pulls in plugins that peer on ESLint ^9
      # (@microsoft/eslint-plugin-sdl, eslint-plugin-import, eslint-plugin-react).
      - dependency-name: eslint
        versions: ['>=10.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
