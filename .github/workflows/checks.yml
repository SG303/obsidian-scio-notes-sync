name: Plugin checks and release

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run package
      - run: npm run export
      - name: Stage installable assets
        run: |
          mkdir -p dist/release
          cp main.js manifest.json LICENSE dist/scio-notes.zip dist/release/
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-assets
          path: dist/release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: plugin-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate release version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 scripts/release.py check --tag "$RELEASE_TAG"
          python3 scripts/release.py notes --output "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@v8
        with:
          name: plugin-assets
          path: dist/release
          # Fail on artifact digest mismatches (v8 default, kept explicit).
          digest-mismatch: error
      - name: Publish verified plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Scio Notes $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/release/main.js dist/release/manifest.json \
            dist/release/LICENSE dist/release/scio-notes.zip
